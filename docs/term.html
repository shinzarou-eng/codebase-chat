<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>term demo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#07090d; width:1240px; font-family:'JetBrains Mono',monospace; overflow:hidden; }
  body::before {
    content:''; position:absolute; inset:0;
    background-image: radial-gradient(ellipse 70% 55% at 50% 0%, rgba(59,130,246,.10), transparent 70%);
  }
  .win {
    position:relative; margin:40px 40px 0;
    background:#0b0e14; border:1px solid rgba(255,255,255,.09); border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(110,194,255,.05);
    overflow:hidden;
  }
  .chrome {
    display:flex; align-items:center; gap:14px; padding:11px 16px;
    background:#10151c; border-bottom:1px solid rgba(255,255,255,.06);
  }
  .dots { display:flex; gap:7px; }
  .dots span { width:11px;height:11px;border-radius:50%; }
  .dots span:nth-child(1){background:#ff5f57}.dots span:nth-child(2){background:#febc2e}.dots span:nth-child(3){background:#28c840}
  .title { flex:1; text-align:center; font-size:12px; color:#5b6679; }
  .live { font-size:10px; font-weight:700; letter-spacing:.08em; color:#4ade80;
    background:rgba(74,222,128,.1); border:1px solid rgba(74,222,128,.25); padding:3px 9px; border-radius:99px; }

  #term { padding:20px 24px 22px; font-size:14.5px; line-height:1.62; height:660px; overflow-y:auto; scrollbar-width:none; }
  #term::-webkit-scrollbar { display:none; }
  .ln { white-space:pre-wrap; word-break:break-word; }
  .ln.hidden { display:none; }

  .c-prompt { color:#7ee787; font-weight:600; }
  .c-tool { color:#a78bfa; font-weight:600; }
  .c-assist { color:#b8a6ff; font-weight:600; }
  .c-src { color:#6ec2ff; }
  .c-dim { color:#5b6679; }
  .c-fg { color:#c9d1d9; }
  .c-red { color:#f87171; font-weight:600; }
  .c-redx { color:#f8a5a5; }
  .c-amber { color:#fbbf24; font-weight:600; }
  .c-green { color:#4ade80; font-weight:600; }
  .c-white { color:#e6edf3; font-weight:700; }
  .c-cyan { color:#67e8f9; }

  .cur { display:inline-block; color:#7ee787; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  .foot { position:relative; text-align:center; padding:14px 0 18px; font-size:11px; color:#5b6679; letter-spacing:.03em; }
  .foot b { color:#93a1b5; }
</style>
</head>
<body>
<div class="win">
  <div class="chrome">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="title">dsh-codebase-chat — real MCP session · ~/player-mode</div>
    <div class="live">REAL CALLS</div>
  </div>
  <div id="term"></div>
</div>
<div class="foot">real stdio MCP session on a real codebase — <b>422 files</b> · no API key · no mockups</div>

<script>
// Real transcript captured from live tools/call on player-mode (verbatim values:
// 1839 indexed files, 9,536,806 tokens, 212,669 terms, 0/100 score, 324 cycles…).
const LINES = [
  ['c-prompt', 'You › scan this repo for problems'],
  ['c-tool',   '→ tools/call codebase_health {"projectPath":"~/player-mode"}'],
  ['c-dim',    '  walk: 1839 files · skip node_modules/dist/.git · index cache hot'],
  ['c-dim',    '  index: 9,536,806 tokens · 212,669 terms · AST chunks (babel + tree-sitter)'],
  ['c-dim',    '  static pass: import graph → cycles → dead exports → dup blocks → complexity'],
  ['c-fg',     ''],
  ['c-white',  '## Static analysis — `player-mode`'],
  ['c-red',    'Health score : ░░░░░░░░░░ 0/100 (E)  ·  422 files analyzed · 1175 local imports'],
  ['c-fg',     ''],
  ['c-red',    '  Circular dependencies — 324'],
  ['c-redx',   '  - playerStore.ts → playerTypes.ts → pmAgentEngine.ts → playerStore.ts'],
  ['c-redx',   '  - pmAgentEngine.ts → pmTransferEngine.ts → pmAgentEngine.ts'],
  ['c-redx',   '  - remoteData.ts → clubUtils.ts → pmScoutingEngine.ts → … → remoteData.ts'],
  ['c-fg',     ''],
  ['c-amber',  '  Unused files — 43      Unused exports — 827'],
  ['c-amber',  '  Duplicate blocks — 15  Complexity hotspots — 183'],
  ['c-fg',     ''],
  ['c-prompt', 'You › how does the match simulation work?'],
  ['c-tool',   '→ tools/call codebase_chat {"query":"how does the match simulation work?"}'],
  ['c-dim',    '  retrieval: 212,669 terms scored → top chunks under 60k-token budget'],
  ['c-dim',    '  assembled: 98 cited chunks · 221k chars → returned to host model (promptOnly)'],
  ['c-fg',     ''],
  ['c-src',    '  [source: src/components/calendar/PreMatchStudio.tsx:128-145]'],
  ['c-src',    '  [source: src/features/career/engine/pmCalendarEngine.ts:284-325]'],
  ['c-src',    '  [source: src/features/career/engine/pmCareerEngine.ts:1276-1292]'],
  ['c-fg',     ''],
  ['c-assist', 'Assistant › Match days are driven by pmCalendarEngine — fixtureDayEvent builds'],
  ['c-assist', '  the day flow, PreMatchStudio is the pre-match prep screen, and the pm*'],
  ['c-assist', '  engines run the sim.'],
  ['c-src',    '  [source: src/features/career/engine/pmCalendarEngine.ts:284]  [Confidence: 85%]'],
  ['c-fg',     ''],
  ['c-prompt', 'You › give me the priorities'],
  ['c-tool',   '→ tools/call codebase_tasks {"focus":"break the dependency cycles"}'],
  ['c-dim',    '  retrieval: cycles + audit signals → 63 cited chunks · 233k chars → host model'],
  ['c-fg',     ''],
  ['c-assist', 'Assistant › 1. Extract shared types out of playerStore.ts → kills most of'],
  ['c-assist', '  the 324 cycles.  2. Audit the 827 unused exports before the next feature.'],
  ['c-src',    '  [source: src/features/player/engine/playerTypes.ts]  [Severity: High]'],
];

const term = document.getElementById('term');
const els = LINES.map(([cls, text]) => {
  const d = document.createElement('div');
  d.className = 'ln hidden ' + cls;
  d.innerHTML = text === '' ? '&nbsp;' : escapeHtml(text);
  term.appendChild(d);
  return d;
});
const cursor = document.createElement('div');
cursor.className = 'ln c-prompt';
cursor.innerHTML = '<span class="cur">▌</span>';
term.appendChild(cursor);

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

const HOLDS = { 0:0, 3:0, 11:0, 12:0, 20:0, 21:0, 23:0, 24:0, 30:0 }; // beats where we linger
window.__upto = (n) => {
  els.forEach((el, i) => el.classList.toggle('hidden', i > n));
  cursor.style.display = 'block';
  term.scrollTop = term.scrollHeight;
};
window.__upto(LINES.length - 1);
</script>
</body>
</html>
