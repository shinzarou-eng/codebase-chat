<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="dsh-codebase-chat social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4cc2ff" stop-opacity="0.12"/>
      <stop offset="65%" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Real app logo -->
  <image href="logo.png" x="140" y="196" width="248" height="248"/>

  <!-- Text on the right -->
  <g transform="translate(520, 320)">
    <text x="0" y="-58" fill="#f0f0f0" font-family="Segoe UI, system-ui, sans-serif" font-size="70" font-weight="600" letter-spacing="-1">dsh-codebase-chat</text>
    <text x="0" y="8" fill="#4cc2ff" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="400" letter-spacing="-0.3">Multi-language codebase intelligence</text>
    <text x="0" y="52" fill="#a3a3a3" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400">100% local · deterministic audit · FR / EN</text>

    <!-- Fluent chips -->
    <g transform="translate(0, 92)" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <rect x="0" y="0" width="150" height="34" rx="6" fill="#2b2b2b" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
      <text x="75" y="22" fill="#f0f0f0">DeepSeek Harness</text>

      <rect x="162" y="0" width="62" height="34" rx="6" fill="rgba(76,194,255,0.13)" stroke="rgba(76,194,255,0.35)" stroke-width="1"/>
      <text x="193" y="22" fill="#4cc2ff">MCP</text>

      <rect x="236" y="0" width="96" height="34" rx="6" fill="#2b2b2b" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
      <text x="284" y="22" fill="#f0f0f0">--no-llm</text>
    </g>
  </g>
</svg>
