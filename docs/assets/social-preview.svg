    <path d="M 100 102 L 78 124 L 100 146" fill="none" stroke="#8dd6ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 156 102 L 178 124 L 156 146" fill="none" stroke="#8dd6ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
